<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toru Asakura - GFX Design</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #d8edf7;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container utama */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 450px; /* Menyesuaikan proporsi gambar */
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #a4d8f0 0%, #cde8f5 100%);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        @media (max-width: 450px) {
            .app-container {
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
        }

        /* Hashtag Kanan Atas */
        .hashtag {
            position: absolute;
            top: 30px;
            right: 25px;
            font-size: 13px;
            font-weight: 500;
            color: #222;
            z-index: 10;
        }

        /* Teks Belakang Besar (ASAKURA) */
        .bg-text {
            position: absolute;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%) scaleY(1.8); /* Ditarik memanjang secara vertikal */
            font-family: 'Bebas Neue', sans-serif;
            font-size: 170px;
            color: #ffffff;
            letter-spacing: 2px;
            text-align: center;
            /* Efek outline dan shadow biru */
            -webkit-text-stroke: 1px #8bc9e6;
            text-shadow: 8px 8px 0px rgba(139, 201, 230, 0.6);
            z-index: 1;
            white-space: nowrap;
        }

        /* Teks Sambung (Toru) */
        .cursive-text {
            position: absolute;
            top: 8%;
            left: 8%;
            font-family: 'Caveat', cursive;
            font-size: 85px;
            color: #111;
            transform: rotate(-12deg);
            z-index: 3;
        }

        /* Karakter Utama */
        .character-img {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 110%; /* Skala lebih besar agar memenuhi area */
            z-index: 2;
            pointer-events: none;
        }

        /* Tooltip (Toru) di sebelah kanan */
        .tooltip {
            position: absolute;
            bottom: 12%;
            right: 15%;
            background: #fff;
            padding: 8px 24px;
            border-radius: 20px;
            border: 2px solid #333;
            font-weight: 600;
            font-size: 16px;
            color: #222;
            z-index: 10;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        /* Panah segitiga hitam outline luar */
        .tooltip::before {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 20px;
            border-width: 15px 12px 0;
            border-style: solid;
            border-color: #333 transparent transparent transparent;
        }
        /* Panah segitiga putih untuk menutupi bagian tengah agar terlihat seperti border */
        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 22px;
            border-width: 12px 10px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

        /* Area UI Kiri Bawah */
        .ui-container {
            position: absolute;
            bottom: 5%;
            left: 5%;
            width: 75%;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Komponen UI Glass/White */
        .card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        /* Search Bar */
        .search-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            width: 75%;
            border-radius: 10px;
        }
        .search-bar span {
            font-weight: 500;
            font-size: 15px;
            color: #111;
        }
        
        /* About Box */
        .about-box {
            position: relative;
            display: flex;
            align-items: center;
            padding: 18px 20px;
            width: 100%;
            border-radius: 10px;
        }
        .about-text {
            font-size: 10px;
            color: #444;
            line-height: 1.5;
            flex: 1;
            padding-right: 20px;
        }

        /* Tombol panah bulat melayang di pojok kanan bawah boks */
        .btn-arrow {
            position: absolute;
            bottom: -15px;
            right: -10px;
            background: #333;
            color: #fff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 3px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            cursor: pointer;
            z-index: 11;
        }
        
    </style>
</head>
<body>

    <div class="app-container">
        
        <div class="hashtag">#AnimeGFXDesign</div>

        <!-- Teks belakang besar dengan font padat -->
        <div class="bg-text">
            ASAKURA
        </div>

        <!-- Teks sambung -->
        <div class="cursive-text">Toru</div>

        <!-- KARAKTER UTAMA: Ganti src ini dengan gambar chara.png -->
        <img src="chara.png" alt="Toru Asakura" class="character-img">

        <!-- Tooltip Kanan Bawah -->
        <div class="tooltip">Toru</div>

        <!-- UI KOTAK BAWAH KIRI -->
        <div class="ui-container">
            
            <!-- Kotak Pencarian -->
            <div class="card search-bar">
                <span>About me_|</span>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </div>

            <!-- Kotak Deskripsi -->
            <div class="card about-box">
                <div class="about-text">
                    Toru Asakura is a character from THE IDOLM@STER Shiny Colors and a member of the unit noctchill. She is 17 years old, 160 cm tall, has purple-cyan hair, and a calm, laid-back yet captivating personality. She is voiced by Yuu Wakui.
                </div>
                <!-- Tombol Navigasi Menimpa Kotak -->
                <div class="btn-arrow">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6"></polyline>
                    </svg>
                </div>
            </div>

        </div>

    </div>

</body>
</html>
