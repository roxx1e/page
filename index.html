<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animera Landing Page</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #222222; /* Dark wrapper to mimic the mockup presentation */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1rem;
        }

        .app-container {
            background-color: #f6f7f9;
            background-image: radial-gradient(circle at 10% 20%, rgba(220, 224, 227, 0.5) 0%, transparent 50%), 
                              radial-gradient(circle at 90% 80%, rgba(220, 224, 227, 0.5) 0%, transparent 50%);
            width: 100%;
            max-width: 1200px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            position: relative;
        }

        .font-oswald { font-family: 'Oswald', sans-serif; }

        .blue-shape {
            background-color: #5a7f9b;
            clip-path: polygon(15% 0, 100% 0, 100% 100%, 0% 100%);
            border-radius: 1.5rem;
        }

        /* Responsive image tweaks */
        .anime-character {
            filter: drop-shadow(-5px 5px 10px rgba(0,0,0,0.3));
        }

        /* Ripple effect for bottom left icon */
        .ripple-bg {
            background: radial-gradient(circle, #5a7f9b88 0%, transparent 60%);
        }
    </style>
</head>
<body>

    <!-- Main Mockup Container -->
    <div class="app-container rounded-sm md:rounded-xl">
        
        <!-- Navbar -->
        <nav class="flex justify-between items-center py-6 px-6 md:px-12 relative z-20">
            <!-- Search -->
            <div class="relative hidden sm:block">
                <i class="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-500 text-sm"></i>
                <input type="text" class="bg-transparent border border-gray-300 rounded-full py-1.5 pl-10 pr-4 w-48 text-sm focus:outline-none focus:border-gray-500 transition-colors" placeholder="">
            </div>
            <div class="sm:hidden block text-gray-700 text-xl cursor-pointer">
                <i class="fas fa-bars"></i>
            </div>

            <!-- Links -->
            <ul class="hidden md:flex gap-10 font-bold text-sm tracking-wide">
                <li class="cursor-pointer text-black">Home</li>
                <li class="cursor-pointer text-gray-400 hover:text-black transition">thunder</li>
                <li class="cursor-pointer text-gray-400 hover:text-black transition">animera</li>
                <li class="cursor-pointer text-gray-400 hover:text-black transition">souls</li>
            </ul>

            <!-- Right Icons -->
            <div class="flex items-center gap-6">
                <div class="relative cursor-pointer">
                    <i class="fas fa-bell text-gray-800 text-lg"></i>
                    <span class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-red-600 border-2 border-[#f6f7f9] rounded-full"></span>
                </div>
                <!-- Mock Logo -->
                <div class="w-10 h-10 flex items-center justify-center cursor-pointer">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/1/1a/US_Department_of_Veterans_Affairs_seal.svg/1024px-US_Department_of_Veterans_Affairs_seal.svg.png" alt="Logo" class="w-full h-full object-contain filter grayscale opacity-80 mix-blend-multiply">
                </div>
            </div>
        </nav>

        <!-- Hero Section -->
        <main class="flex flex-col lg:flex-row px-6 md:px-12 pt-4 pb-20 relative z-10">
            
            <!-- Left Content -->
            <div class="lg:w-[55%] flex flex-col justify-center relative mt-8 lg:mt-0">
                <!-- Headings -->
                <div class="mb-4">
                    <h1 class="text-[3.5rem] sm:text-[5.5rem] lg:text-[6.5rem] font-black uppercase leading-[0.85] font-oswald text-[#1a1a1a] tracking-tight">
                        INFORMATIONS
                    </h1>
                    <div class="flex items-baseline gap-3 sm:gap-4 mt-1">
                        <span class="text-xl sm:text-2xl font-bold text-[#b59b6c] font-oswald tracking-widest">ABOUT</span>
                        <h1 class="text-[3.8rem] sm:text-[5.5rem] lg:text-[6.5rem] font-black uppercase leading-[0.85] font-oswald text-[#1a1a1a] tracking-tight">
                            ANIMERA
                        </h1>
                    </div>
                </div>

                <!-- Subtitle -->
                <div class="flex items-center gap-4 mt-6">
                    <div class="w-12 sm:w-16 h-px bg-gray-400"></div>
                    <span class="text-[#7d90a1] font-bold tracking-[0.2em] text-xs sm:text-sm uppercase">WHAT DO YOU THINK?</span>
                </div>

                <!-- Paragraph -->
                <p class="mt-5 text-gray-600 max-w-sm text-sm sm:text-base font-medium leading-relaxed">
                    Zero Two is one of the main characters in the anime
                </p>

                <!-- Button -->
                <button class="mt-8 bg-[#5a7f9b] text-white px-8 py-2.5 rounded-lg font-semibold tracking-wider text-sm w-max shadow-lg hover:bg-[#43627a] transition duration-300">
                    CONTACT UP
                </button>

                <!-- Bottom Left Badge (Desktop only for positioning, inline on mobile) -->
                <div class="mt-16 lg:mt-0 lg:absolute lg:-bottom-6 lg:left-0 flex items-center gap-5">
                    <div class="relative flex items-center justify-center w-16 h-16 rounded-full bg-white shadow-md border-[5px] border-[#e2e7ec]">
                        <div class="absolute inset-0 rounded-full ripple-bg scale-150 -z-10"></div>
                        <span class="text-2xl font-black text-[#5a7f9b] font-oswald">4</span>
                    </div>
                    <div class="font-bold text-xs sm:text-sm leading-tight text-gray-900 font-oswald tracking-widest flex flex-col">
                        <span>THE SOULS</span>
                        <span class="text-lg sm:text-xl">ANIMERA</span>
                    </div>
                </div>
            </div>

            <!-- Right Content (Image & Features) -->
            <div class="lg:w-[45%] flex flex-col items-center lg:items-end relative mt-16 lg:mt-0">
                
                <!-- Anime Image Container -->
                <div class="relative w-[90%] sm:w-[350px] lg:w-[400px] h-[350px] sm:h-[450px]">
                    <!-- Background Shape -->
                    <div class="absolute inset-0 blue-shape z-0"></div>
                    
                    <!-- Anime Character (Using a high-quality transparent PNG placeholder to match vibe) -->
                    <!-- In production, replace src with your exact image asset -->
                    <img src="https://i.ibb.co/3s2t1tD/anime-girl-transparent.png" 
                         alt="Anime Character" 
                         class="anime-character absolute bottom-0 left-1/2 transform -translate-x-1/2 h-[115%] w-auto object-cover object-bottom z-10 pointer-events-none"
                         onerror="this.src='https://www.pngplay.com/wp-content/uploads/12/Anime-Girl-Transparent-Free-PNG.png'"> 
                         <!-- Fallback URL if first link breaks -->
                </div>

                <!-- Features Footer -->
                <div class="flex justify-between items-start mt-10 lg:mt-8 w-full max-w-[420px]">
                    
                    <!-- Feature 1 -->
                    <div class="flex-1 text-center flex flex-col items-center px-2">
                        <div class="w-8 h-8 rounded-md bg-[#d8b87d] text-white flex items-center justify-center mb-3 shadow-md">
                            <i class="fas fa-shopping-bag text-xs"></i>
                        </div>
                        <p class="text-[9px] sm:text-[10px] text-gray-500 font-bold uppercase leading-relaxed tracking-wider">
                            NEW NEWS ABOUT ALL<br>THE NEW ANIME
                        </p>
                    </div>

                    <!-- Divider -->
                    <div class="w-px h-12 bg-gray-300 mt-2 hidden sm:block"></div>

                    <!-- Feature 2 -->
                    <div class="flex-1 text-center flex flex-col items-center px-2">
                        <div class="w-8 h-8 rounded-md bg-[#d8b87d] text-white flex items-center justify-center mb-3 shadow-md">
                            <i class="fas fa-truck text-xs"></i>
                        </div>
                        <p class="text-[9px] sm:text-[10px] text-gray-500 font-bold uppercase leading-relaxed tracking-wider">
                            NEW CONTESTS AND<br>EVENTS FOR MEMBERS
                        </p>
                    </div>

                    <!-- Divider -->
                    <div class="w-px h-12 bg-gray-300 mt-2 hidden sm:block"></div>

                    <!-- Feature 3 -->
                    <div class="flex-1 text-center flex flex-col items-center px-2">
                        <div class="w-8 h-8 rounded-md bg-[#d8b87d] text-white flex items-center justify-center mb-3 shadow-md">
                            <i class="fas fa-globe text-xs"></i>
                        </div>
                        <p class="text-[9px] sm:text-[10px] text-gray-500 font-bold uppercase leading-relaxed tracking-wider">
                            INFORMATION ABOUT<br>OLD AND NEW ANIME
                        </p>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- Presentation Slider Dots (Mockup element at bottom) -->
    <div class="flex gap-2 mt-6">
        <div class="w-2.5 h-2.5 rounded-full bg-gray-500"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-white"></div>
        <div class="w-2.5 h-2.5 rounded-full bg-gray-500"></div>
    </div>

</body>
    </html>
