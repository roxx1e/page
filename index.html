<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lea Bot - WhatsApp Assistant</title>
    <link rel="stylesheet" href="style.css">
    <!-- Menggunakan font Google -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="hero">
            <div class="hero-image">
                <!-- Ganti src dengan path chara.png kamu -->
                <img src="chara.png" alt="Lea Bot Character" id="bot-image">
            </div>
            <div class="hero-text">
                <h1>Lea Bot</h1>
                <p>Asisten WhatsApp otomatis, cepat, dan responsif.</p>
                <div class="status-badge">
                    <span class="indicator"></span> API Aktif
                </div>
            </div>
        </header>

        <section class="stats-section">
            <h2>Statistik Realtime</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Pengguna</h3>
                    <p class="stat-value" id="user-count">Memuat...</p>
                    <span class="stat-desc">Total user terdaftar</span>
                </div>
                <div class="stat-card">
                    <h3>Grup</h3>
                    <p class="stat-value" id="group-count">Memuat...</p>
                    <span class="stat-desc">Grup yang dilayani</span>
                </div>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 Lea Bot. All rights reserved.</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
