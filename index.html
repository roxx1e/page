<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toru Asakura - GFX Design</title>
    <!-- Import Google Fonts: Bebas Neue, Caveat, dan Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Caveat:wght@700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #e2f1f8; /* Background luar container */
            font-family: 'Manrope', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Container utama dengan nuansa soft sky blue */
        .app-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 850px;
            background: linear-gradient(180deg, #9fd3ef 0%, #cfeafb 45%, #eef8ff 100%);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        /* Dekorasi Background Abstrak - Blur Circle */
        .app-container::before {
            content: "";
            position: absolute;
            width: 550px;
            height: 550px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .18);
            filter: blur(20px);
            top: -180px;
            right: -180px;
            z-index: 0;
        }

        /* Dekorasi Background Abstrak - Diagonal Shape */
        .app-container::after {
            content: "";
            position: absolute;
            width: 120px;
            height: 120%;
            background: rgba(255, 255, 255, .08);
            transform: rotate(22deg);
            left: 58%;
            top: -10%;
            z-index: 0;
        }

        @media (max-width: 450px) {
            .app-container {
                height: 100vh;
                max-height: none;
                box-shadow: none;
            }
        }

        /* Hashtag */
        .hashtag {
            position: absolute;
            top: 35px;
            right: 35px;
            font-size: 14px;
            font-weight: 600;
            color: #1f2d3d;
            z-index: 10;
        }

        /* Teks Belakang Besar (ASAKURA) */
        .bg-text {
            position: absolute;
            top: 45%;
            left: 50%;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 180px;
            letter-spacing: 6px;
            color: #fff;
            opacity: .95;
            transform: translate(-50%, -50%) scaleY(1.65);
            -webkit-text-stroke: 1px rgba(120, 185, 220, .5);
            text-shadow: 10px 10px 0 rgba(126, 192, 228, .45);
            z-index: 1;
            white-space: nowrap;
        }

        /* Teks Sambung (Toru) */
        .cursive-text {
            position: absolute;
            top: 8%;
            left: 8%;
            font-family: 'Caveat', cursive;
            font-size: 95px;
            font-weight: 700;
            color: #111;
            transform: rotate(-8deg);
            z-index: 3;
        }

        /* Karakter Utama */
        .character-img {
            position: absolute;
            width: 108%;
            bottom: 0;
            left: 52%;
            transform: translateX(-50%);
            z-index: 2;
            pointer-events: none;
        }

        /* Tooltip (Toru) */
        .tooltip {
            position: absolute;
            bottom: 12%;
            right: 15%;
            background: #fff;
            border: 3px solid #2d2d2d;
            border-radius: 16px;
            font-weight: 700;
            font-size: 20px;
            padding: 10px 28px;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, .08);
            color: #222;
            z-index: 10;
        }

        /* Ekor Tooltip (Panah Segitiga Hitam) */
        .tooltip::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 20px;
            border-width: 15px 12px 0;
            border-style: solid;
            border-color: #2d2d2d transparent transparent transparent;
        }

        /* Ekor Tooltip (Panah Segitiga Putih Penutup) */
        .tooltip::after {
            content: '';
            position: absolute;
            bottom: -11px;
            left: 22px;
            border-width: 12px 10px 0;
            border-style: solid;
            border-color: #fff transparent transparent transparent;
        }

    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- Hashtag -->
        <div class="hashtag">#AnimeGFXDesign</div>

        <!-- Teks Belakang (ASAKURA) -->
        <div class="bg-text">
            ASAKURA
        </div>

        <!-- Teks Sambung (Toru) -->
        <div class="cursive-text">Toru</div>

        <!-- KARAKTER UTAMA: Ganti src ini dengan gambar chara.png -->
        <img src="chara.png" alt="Toru Asakura" class="character-img">

        <!-- Tooltip Kanan Bawah -->
        <div class="tooltip">Toru</div>

    </div>

</body>
</html>
